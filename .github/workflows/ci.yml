# Lint, typecheck, unit tests, build, budget and Playwright e2e.
# The repo is public (D-30), so Actions minutes are free: runs on pushes to main, pull requests and by hand.
# Day 0: push only after the scaffold exists, so the first run is a real one (no package.json = red run).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC   # display code must not depend on the runner's zone (D-06)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Sample data as of 08:00 in Lagos today, as in the local e2e build (playwright.config.ts): built at
      # the real hour, a run after about 20:00 holds only the evening's last showings. Vercel's own build
      # still runs `npm run build` at the real hour, which is right for the site people see.
      - name: Build (static export)
        run: node scripts/refresh.ts --fixtures --now "$(TZ=Africa/Lagos date +%F)T07:00:00Z" && npx --no-install next build
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}

      - name: Page weight budget
        run: npm run budget

      # No --with-deps: it runs apt-get for extra system packages, and on 11 Nov 2026 that step hung
      # on the runner's package mirror until the job timed out. The runner image already has the
      # libraries Chromium needs. The time limit turns any future hang into a quick, clear failure.
      - name: Install Playwright browser
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
